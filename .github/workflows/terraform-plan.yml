name: Terraform Validate

# The HCP Terraform workspace runs in Local execution mode and Terraform is
# executed on the operator machine with `az login`. CI has no Azure credentials
# and the student subscription does not allow creating a service principal, so
# `terraform plan` cannot authenticate here. CI therefore validates the
# configuration only; the real plan/apply is a documented manual step.
on:
  pull_request:
    branches: [develop]
    paths:
      - '**/*.tf'

permissions:
  contents: read

jobs:
  validate:
    name: Format, init and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
