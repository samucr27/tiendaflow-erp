name: Azure Deploy

# Manual only. The primary deployment path is local (`az webapp deploy`); this
# workflow is the secondary path for a machine without the Azure CLI. It uses a
# publish profile because Azure for Students does not allow creating app
# registrations or service principals for OIDC.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/TiendaFlow.Web/TiendaFlow.Web.csproj --no-build --configuration Release --output publish

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version "9.*"

      - name: Create EF migration bundle
        run: >
          dotnet ef migrations bundle
          --project src/TiendaFlow.Infrastructure/TiendaFlow.Infrastructure.csproj
          --startup-project src/TiendaFlow.Web/TiendaFlow.Web.csproj
          --configuration Release
          --self-contained
          --runtime linux-x64
          --output efbundle
          --force

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiendaflow-app
          path: publish

      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: tiendaflow-efbundle
          path: efbundle

  deploy:
    name: Deploy with publish profile
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: tiendaflow-app
          path: publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Check /healthz
        env:
          APP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" "$APP_URL/healthz")
            if [ "$code" = "200" ]; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code; waiting 10 seconds."
            sleep 10
          done

          echo "Health check failed: $APP_URL/healthz did not return 200."
          exit 1
