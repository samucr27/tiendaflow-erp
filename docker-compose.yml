services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tiendaflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TiendaFlow_Dev#2026"
    ports:
      - "1433:1433"
    volumes:
      - tiendaflow-sql-data:/var/opt/mssql

volumes:
  tiendaflow-sql-data: